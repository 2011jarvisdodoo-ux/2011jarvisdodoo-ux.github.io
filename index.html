<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JCF | Official MMA Fighter Rankings</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -3px;
    }

    nav {
      display: flex;
      gap: 32px;
      font-weight: 900;
      font-size: 13px;
    }

    nav a {
      color: white;
      text-decoration: none;
      transition: .2s;
    }

    nav a:hover {
      color: #d40000;
    }

    .hero {
      background: white;
      padding: 65px 6% 55px;
      border-bottom: 1px solid #ddd;
    }

    .small-title {
      color: #d40000;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 88px);
      font-weight: 900;
      letter-spacing: -5px;
      line-height: .88;
    }

    .ranking {
      max-width: 1250px;
      margin: 0 auto;
      padding: 50px 6%;
    }

    .gender-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #d40000;
      margin: 10px 0 35px;
      padding-bottom: 12px;
      border-bottom: 3px solid #111;
    }

    .division {
      margin-bottom: 65px;
    }

    .division-title {
      font-size: 26px;
      font-weight: 900;
      border-bottom: 4px solid #111;
      padding-bottom: 12px;
      text-transform: uppercase;
    }

    .fighter {
      background: white;
      min-height: 90px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid #ddd;
      cursor: pointer;
      transition: .2s;
    }

    .fighter:hover {
      background: #eeeeee;
    }

    .fighter.champion {
      min-height: 165px;
    }

    .rank {
      width: 85px;
      min-width: 85px;
      text-align: center;
      font-size: 25px;
      font-weight: 900;
      color: #999;
    }

    .champion .rank {
      color: #111;
      font-size: 27px;
    }

    .fighter-info {
      flex: 1;
      padding: 20px 10px;
      z-index: 2;
    }

    .status {
      color: #d40000;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .fighter-name {
      font-size: clamp(21px, 3.5vw, 38px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
    }

    .fighter-image {
      width: 155px;
      height: 125px;
      object-fit: contain;
      align-self: flex-end;
      margin-right: 35px;
    }

    .champion .fighter-image {
      width: 190px;
      height: 160px;
    }

    .movement {
      width: 65px;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
      margin-right: 5px;
    }

    .movement.up {
      color: #8fcf00;
    }

    .movement.down {
      color: #c40000;
    }

    .arrow {
      width: 55px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    /* =========================
       POUND FOR POUND
       ========================= */

    .p4p-section {
      margin-top: 30px;
      margin-bottom: 70px;
    }

    .p4p-title {
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      border-bottom: 4px solid #111;
      padding-bottom: 12px;
      margin-bottom: 0;
    }

    .p4p-gender {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #d40000;
      margin: 35px 0 0;
      padding: 14px 0;
      border-bottom: 3px solid #111;
    }

    .p4p-fighter {
      background: white;
      min-height: 105px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid #ddd;
      transition: .2s;
    }

    .p4p-fighter:hover {
      background: #eeeeee;
    }

    .p4p-rank {
      width: 85px;
      min-width: 85px;
      text-align: center;
      font-size: 27px;
      font-weight: 900;
      color: #999;
    }

    .p4p-info {
      flex: 1;
      padding: 18px 10px;
    }

    .p4p-name {
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 7px;
    }

    .p4p-record {
      font-size: 12px;
      font-weight: 900;
      color: #777;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .p4p-status {
      color: #d40000;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-top: 5px;
    }

    .p4p-image {
      width: 120px;
      height: 100px;
      object-fit: contain;
      align-self: flex-end;
      margin-right: 35px;
    }

    footer {
      background: #111;
      color: #888;
      text-align: center;
      padding: 35px;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 700px) {

      header {
        height: 60px;
        padding: 0 18px;
      }

      .logo {
        font-size: 29px;
      }

      nav {
        display: none;
      }

      .hero {
        padding: 45px 20px 38px;
      }

      h1 {
        font-size: 48px;
        letter-spacing: -3px;
      }

      .ranking {
        padding: 35px 12px;

      .gender-title {
        margin-bottom: 25px;
      }

      .division {
        margin-bottom: 45px;
      }

      .division-title {
        font-size: 20px;
        padding-bottom: 10px;
      }

      .fighter {
        min-height: 75px;
      }

      .fighter.champion {
        min-height: 125px;
      }

      .rank {
        width: 42px;
        min-width: 42px;
        font-size: 17px;
      }

      .champion .rank {
        font-size: 20px;
      }

      .fighter-info {
        padding: 12px 5px;
      }

      .status {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .fighter-name {
        font-size: 19px;
      }

      .fighter-image {
        width: 85px;
        height: 90px;
        margin-right: 0;
      }

      .champion .fighter-image {
        width: 105px;
        height: 110px;
      }

      .movement {
        width: 45px;
        font-size: 11px;
      }

      .arrow {
        width: 32px;
        font-size: 20px;
      }

      /* MOBILE P4P */

      .p4p-section {
        margin-top: 20px;
      }

      .p4p-title {
        font-size: 25px;
      }

      .p4p-gender {

        font-size: 8px;
      }

      .p4p-image {
        width: 80px;
        height: 75px;
        margin-right: 0;
      }
    }

/* =========================================================

   ========================================================= */

divisions.forEach((division) => {

  if (division.gender !== currentGender) {

    currentGender = division.gender;

    const genderTitle =
      document.createElement("div");

    genderTitle.className =
      "gender-title";

    genderTitle.textContent =
      division.gender === "MEN"
      ? "MEN'S RANKINGS"
      : "WOMEN'S RANKINGS";

    rankingsContainer.appendChild(
      genderTitle
    );
  }


  const divisionSection =
    document.createElement("section");

  divisionSection.className =
    "division";


  const divisionTitle =
    document.createElement("div");

  divisionTitle.className =
    "division-title";

  divisionTitle.textContent =
    division.name;

  divisionSection.appendChild(
    divisionTitle
  );


  /* CHAMPION */

  if (division.champion) {

    const champion =
      createFighter(
        "C",
        division.champion,
        "JCF CHAMPION",
        true,
        division.image
      );

    divisionSection.appendChild(
      champion
    );

  } else {

    const vacant =
      createFighter(
        "C",
        "VACANT",
        "JCF CHAMPIONSHIP",
        true,
        null
      );

    divisionSection.appendChild(
      vacant
    );
  }


  /* #1 - #15 */

  division.fighters.forEach(
    (fighterData, index) => {

      const rank = index + 1;

      const name =
        typeof fighterData === "string"
        ? fighterData
        : fighterData.name;

      const movement =
        typeof fighterData === "string"
        ? 0
        : fighterData.movement || 0;

      const fighter =
        createFighter(
          rank,
          name,
          "",
          false,
          null,
          movement
        );

      divisionSection.appendChild(
        fighter
      );
    }
  );

/* =========================================================

function createFighter(
  rank,
  name,
  status,
  isChampion,
  imageURL,
  movement = 0

  const wrapper =
    document.createElement("div");


  const fighter =
    document.createElement("div");


  fighter.className =
    isChampion
    ? "fighter champion"
    : "fighter";


  const rankElement =
    document.createElement("div");

  rankElement.className =
    "rank";

  rankElement.textContent =
    rank;


  const info =
    document.createElement("div");

  info.className =
    "fighter-info";


  /* STATUS */

  if (status) {

    const statusElement =
      document.createElement("div");

    statusElement.className =
      "status";

    statusElement.textContent =
      status;

    info.appendChild(
      statusElement
    );
  }


  /* NAME */

  const nameElement =
    document.createElement("div");

  nameElement.className =
    "fighter-name";

  nameElement.textContent =
    name;

  info.appendChild(
    nameElement
  );


  fighter.appendChild(
    rankElement
  );

  fighter.appendChild(
    info
  );


  /* CHAMPION IMAGE */

  if (
    isChampion &&
    imageURL
  ) {

    const image =
      document.createElement("img");

    image.className =
      "fighter-image";

    image.src =
      imageURL;

    image.alt =
      name + " - JCF Champion";

    image.onerror = function() {
      this.style.display = "none";
    };

    fighter.appendChild(
      image
    );
  }


  /* MOVEMENT */

  if (movement !== 0) {

    const movementElement =
      document.createElement("div");

    movementElement.className =
      movement > 0
      ? "movement up"
      : "movement down";

    movementElement.textContent =
      movement > 0
      ? "▲ " + movement
      : "▼ " + Math.abs(movement);

    fighter.appendChild(
      movementElement
    );
  }


  /* RIGHT ARROW */

  const arrow =
    document.createElement("div");

  arrow.className =
    "arrow";

  arrow.textContent =
    "›";

  fighter.appendChild(
    arrow
  );


  wrapper.appendChild(
    fighter
  );


  return wrapper;
}


/* =========================================================
   CREATE POUND-FOR-POUND FIGHTER
   ========================================================= */

function createP4PFighter(
  rank,
  fighterData
) {

  const row =
    document.createElement("div");

  row.className =
    "p4p-fighter";


  /* RANK */

  const rankElement =
    document.createElement("div");

  rankElement.className =
    "p4p-rank";

  rankElement.textContent =
    rank;

  row.appendChild(
    rankElement
  );


  /* INFO */

  const info =
    document.createElement("div");

  info.className =
    "p4p-info";


  /* NAME */

  const name =
    document.createElement("div");

  name.className =
    "p4p-name";

  name.textContent =
    fighterData.name;

  info.appendChild(
    name
  );


  /* RECORD */

  if (fighterData.record) {

    const record =
      document.createElement("div");

    record.className =
      "p4p-record";

    record.textContent =
      fighterData.record;

    info.appendChild(
      record
    );
  }


  /* STATUS */

  if (fighterData.status) {

    const status =
      document.createElement("div");

    status.className =
      "p4p-status";

    status.textContent =
      fighterData.status;

    info.appendChild(
      status
    );
  }


  row.appendChild(
    info
  );


  /* P4P IMAGE */

  if (fighterData.image) {

    const image =
      document.createElement("img");

    image.className =
      "p4p-image";

    image.src =
      fighterData.image;

    image.alt =
      fighterData.name;

    image.onerror = function() {
      this.style.display = "none";
    };

    row.appendChild(
      image
    );
  }


  return row;
}
